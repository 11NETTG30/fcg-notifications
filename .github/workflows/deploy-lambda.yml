name: Deploy Lambda (ECR + SAM)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'infra/**'
      - '.github/workflows/deploy-lambda.yml'

permissions:
  id-token: write
  contents: read
  packages: read 

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: fcg-notifications-fn
  SAM_STACK_NAME: fcg-notifications

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar credenciais AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login no Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build e push da imagem
        id: build-image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/FCG.Notifications.Function/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          secrets: |
            nuget_auth_token=${{ secrets.NUGET_AUTH_TOKEN }}

      - name: Setup SAM
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: SAM deploy
        working-directory: infra
        run: |
          sam deploy \
            --stack-name "${{ env.SAM_STACK_NAME }}" \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --capabilities CAPABILITY_IAM \
            --region "${{ env.AWS_REGION }}" \
            --image-repositories "NotificationsFunction=${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}" \
            --parameter-overrides \
              ImageUri=${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }} \
              BrokerArn=${{ secrets.MQ_BROKER_ARN }} \
              BrokerCredentialsSecretArn=${{ secrets.MQ_BROKER_SECRET_ARN }} \
              VpcSubnetIds=${{ secrets.VPC_SUBNET_IDS }} \
              VpcSecurityGroupIds=${{ secrets.VPC_SECURITY_GROUP_IDS }} \
              SmtpHost=${{ secrets.SMTP_HOST }} \
              SmtpPorta=${{ secrets.SMTP_PORTA }} \
              SmtpRemetente=${{ secrets.SMTP_REMETENTE }} \
              SmtpUsuario=${{ secrets.SMTP_USUARIO }} \
              SmtpSenha=${{ secrets.SMTP_SENHA }}
