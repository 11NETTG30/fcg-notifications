name: Deploy Container App (ACR + Bicep)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'infra/**'
      - '.github/workflows/deploy-azure.yml'

permissions:
  id-token: write     # OIDC -> Azure AD
  contents: read
  packages: read      # GitHub Packages para pacotes FCG.*

env:
  AZURE_RESOURCE_GROUP: fcg-notifications-rg
  AZURE_LOCATION: brazilsouth
  ACR_NAME: fcgnotifications        # nome do ACR (sem .azurecr.io)
  IMAGE_NAME: fcg-notifications-fn

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar secrets obrigatorios
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ACA_IDENTITY_ID: ${{ secrets.ACA_IDENTITY_ID }}
          RABBITMQ_CONNECTION_STRING: ${{ secrets.RABBITMQ_CONNECTION_STRING }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          NUGET_AUTH_TOKEN: ${{ secrets.NUGET_AUTH_TOKEN }}
        run: |
          faltando=()
          for v in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID ACA_IDENTITY_ID RABBITMQ_CONNECTION_STRING SMTP_HOST NUGET_AUTH_TOKEN; do
            if [ -z "${!v}" ]; then faltando+=("$v"); fi
          done
          if [ ${#faltando[@]} -ne 0 ]; then
            echo "::error::Secrets ausentes ou vazias: ${faltando[*]}. Veja README, secao 'Setup Azure'."
            exit 1
          fi

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: ACR login
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build e push da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/FCG.Notifications.Function/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest
            ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
          secrets: |
            nuget_auth_token=${{ secrets.NUGET_AUTH_TOKEN }}

      - name: Garantir resource group
        run: |
          az group create \
            --name ${{ env.AZURE_RESOURCE_GROUP }} \
            --location ${{ env.AZURE_LOCATION }}

      - name: Deploy Bicep
        uses: azure/arm-deploy@v2
        with:
          scope: resourcegroup
          resourceGroupName: ${{ env.AZURE_RESOURCE_GROUP }}
          template: infra/main.bicep
          parameters: >-
            containerImage=${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
            acrLoginServer=${{ env.ACR_NAME }}.azurecr.io
            userAssignedIdentityId=${{ secrets.ACA_IDENTITY_ID }}
            rabbitMqConnectionString=${{ secrets.RABBITMQ_CONNECTION_STRING }}
            smtpHost=${{ secrets.SMTP_HOST }}
            smtpPorta=${{ secrets.SMTP_PORTA }}
            smtpRemetente=${{ secrets.SMTP_REMETENTE }}
            smtpUsuario=${{ secrets.SMTP_USUARIO }}
            smtpSenha=${{ secrets.SMTP_SENHA }}
          failOnStdErr: false
